# Autor: Equipo Muebles & Decoración
# Levanta la aplicación Laravel y la base de datos MySQL.
# Uso: docker compose up -d --build

services:
  app:
    build: .
    container_name: muebles-app
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: muebles-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
